<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'none'; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>JaarZon</title>
  <link rel="stylesheet" href="style.css">
  <script src="i18n.js" defer></script>
  <script src="daylength.js" defer></script>
</head>
<body>
<main data-daylength-widget>
  <header><div><p class="eyebrow" data-i18n="eyebrow"></p><h1>JaarZon</h1></div><span class="sun" aria-hidden="true">☀</span></header>
  <div class="language-row"><button type="button" data-daylength-language></button></div>
  <div class="location-row"><div aria-live="polite"><p data-daylength-location data-i18n="defaultLocation"></p><p class="location-zone" data-daylength-zone></p></div><button type="button" data-daylength-locate data-i18n-aria="locate">↻</button></div>
  <section class="card chart-card" data-i18n-aria="chartTitle">
    <div class="chart-heading"><h2 data-daylength-year data-i18n="chartTitle"></h2><button type="button" data-daylength-today data-i18n="today"></button></div>
    <svg viewBox="0 0 360 228" role="img" data-i18n-aria="chartTitle" data-daylength-chart></svg>
    <div class="legend"><span class="today-key"></span><span data-i18n="today"></span> <span class="selected-key"></span><span data-i18n="selectedDate"></span></div>
    <p class="hint" data-i18n="hint"></p>
  </section>
  <div class="daystrip">
    <svg class="daystrip-bar" viewBox="0 0 1440 14" preserveAspectRatio="none" role="img" data-i18n-aria="barTitle" data-daylength-bar></svg>
    <svg class="daystrip-now" viewBox="0 0 1440 17" preserveAspectRatio="none" role="img" data-i18n-aria="barTitle" data-daylength-now data-visible="false"><line y1="0" y2="17" class="daystrip-now-halo" vector-effect="non-scaling-stroke" data-daylength-now-halo></line><line y1="0" y2="17" class="daystrip-now-line" vector-effect="non-scaling-stroke" data-daylength-now-line></line></svg>
    <div class="daystrip-hours" aria-hidden="true"><span>00</span><span>06</span><span>12</span><span>18</span><span>24</span></div>
    <div class="daystrip-key"><span><i class="daystrip-night"></i><span data-i18n="night"></span></span><span><i class="daystrip-daylight"></i><span data-i18n="daylight"></span></span><span><i class="daystrip-golden"></i><span data-i18n="golden"></span></span><span data-daylength-bar-status></span></div>
  </div>
  <section class="card details" aria-live="polite" aria-atomic="true">
    <p class="eyebrow" data-i18n="selectedDay"></p>
    <h2 data-daylength-date></h2>
    <p class="duration" data-daylength-value></p>
    <p class="change" data-daylength-change></p>
    <p data-daylength-trend></p>
    <p class="times" data-daylength-times></p>
    <div class="golden-hour">
      <h2 data-i18n="golden"></h2>
      <p><span data-i18n="morning"></span> <span data-daylength-golden-morning></span></p>
      <p><span data-i18n="evening"></span> <span data-daylength-golden-evening></span></p>
    </div>
  </section>
  <section class="extremes" data-i18n-aria="extremes"><div><p class="eyebrow" data-i18n="longest"></p><p data-daylength-longest></p></div><div><p class="eyebrow" data-i18n="shortest"></p><p data-daylength-shortest></p></div></section>
  <footer><span data-daylength-footer data-i18n="footer"></span><br><span data-i18n="horizon"></span><br><a class="privacy-link" href="privacy" data-i18n="privacy"></a></footer>
</main>
</body>
</html>
